name: jobbot

on:
  schedule:
    - cron: "*/10 * * * *"  # GitHub may start scheduled runs a few minutes late
  workflow_dispatch:
    inputs:
      url:
        description: "Optional: process this one job link now"
        required: false
      submit:
        description: "With a link: actually press submit"
        type: boolean
        default: false

# Never let two runs read the same Telegram updates.
concurrency:
  group: jobbot
  cancel-in-progress: false

permissions:
  contents: read

env:
  JOBBOT_STATE_KEY: ${{ secrets.JOBBOT_STATE_KEY }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_MODE: ${{ vars.TELEGRAM_MODE || 'bot' }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$JOBBOT_STATE_KEY" ]; then
            echo "::notice::jobbot is not configured yet - add the repository secrets listed in the README"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore state
        if: steps.cfg.outputs.configured == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .state-cache
          key: jobbot-state-${{ github.run_id }}
          restore-keys: jobbot-state-

      - name: Decrypt state
        if: steps.cfg.outputs.configured == 'true'
        run: scripts/state.sh unpack

      - name: Anything new on Telegram?
        id: peek
        if: steps.cfg.outputs.configured == 'true'
        env:
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && 'yes' || '' }}
        run: python3 scripts/peek_updates.py

      - uses: actions/setup-python@v5
        if: steps.peek.outputs.has_work == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install
        if: steps.peek.outputs.has_work == 'true'
        run: |
          pip install -r requirements.txt
          if [ "$TELEGRAM_MODE" = "user" ]; then pip install -r requirements-telethon.txt; fi
          python -m playwright install --with-deps chromium
          sudo apt-get install -y -qq fonts-lmodern > /dev/null

      - name: Write personal data from secrets
        if: steps.peek.outputs.has_work == 'true'
        env:
          JOBBOT_PROFILE_YAML: ${{ secrets.JOBBOT_PROFILE_YAML }}
          JOBBOT_RESUME_FULLSTACK_YAML: ${{ secrets.JOBBOT_RESUME_FULLSTACK_YAML }}
          JOBBOT_RESUME_AI_YAML: ${{ secrets.JOBBOT_RESUME_AI_YAML }}
        run: scripts/write_data_from_env.sh

      - name: Run
        if: steps.peek.outputs.has_work == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_SOURCE_CHAT: ${{ secrets.TELEGRAM_SOURCE_CHAT }}
          TELEGRAM_NOTIFY_CHAT_ID: ${{ secrets.TELEGRAM_NOTIFY_CHAT_ID }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          JOBBOT_AUTO_SUBMIT: ${{ vars.JOBBOT_AUTO_SUBMIT || 'false' }}
          JOBBOT_MODEL: ${{ vars.JOBBOT_MODEL || 'claude-opus-5' }}
          JOBBOT_MIN_FIT: ${{ vars.JOBBOT_MIN_FIT || '0' }}
          INPUT_URL: ${{ github.event.inputs.url }}
          INPUT_SUBMIT: ${{ github.event.inputs.submit }}
        run: |
          if [ -n "$INPUT_URL" ]; then
            args=(apply "$INPUT_URL" --telegram)
            if [ "$INPUT_SUBMIT" = "true" ]; then args+=(--submit); fi
            python -m jobbot "${args[@]}"
          else
            python -m jobbot run-once
          fi

      - name: Encrypt state
        if: always() && steps.peek.outputs.has_work == 'true'
        run: rm -rf data && scripts/state.sh pack

      - name: Save state
        if: always() && steps.peek.outputs.has_work == 'true'
        uses: actions/cache/save@v4
        with:
          path: .state-cache
          key: jobbot-state-${{ github.run_id }}
