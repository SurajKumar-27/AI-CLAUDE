<!doctype html><html><head><title>Apply - Software Engineer</title></head><body>
<h1>Software Engineer, Full Stack</h1>
<form id="application_form" action="/thanks.html" method="get">
  <div><label for="first_name">First Name *</label><input id="first_name" name="first_name" required></div>
  <div><label for="last_name">Last Name *</label><input id="last_name" name="last_name" required></div>
  <div><label for="email">Email *</label><input id="email" name="email" type="email" required></div>
  <div><label for="phone">Phone</label><input id="phone" name="phone" type="tel"></div>
  <div><label for="resume">Resume/CV *</label><input id="resume" name="resume" type="file" accept=".pdf,.doc,.docx" required></div>
  <div><label for="li">LinkedIn Profile</label><input id="li" name="urls[LinkedIn]"></div>
  <div><label for="yoe">How many years of professional experience do you have with React?</label>
    <select id="yoe" name="yoe" required><option value="">Select...</option><option>Less than 1 year</option><option>1-2 years</option><option>3-5 years</option><option>5+ years</option></select></div>
  <fieldset><legend>Are you legally authorized to work in India? *</legend>
    <label><input type="radio" name="auth" value="yes" required> Yes</label>
    <label><input type="radio" name="auth" value="no"> No</label></fieldset>
  <div><label for="why">Why do you want to join Example Corp? *</label><textarea id="why" name="why" required></textarea></div>
  <div><label><input type="checkbox" name="consent" required> I agree to the privacy policy</label></div>
  <div><label for="ctc">Expected CTC (LPA) *</label><input id="ctc" name="ctc" required></div>
  <button type="submit">Submit Application</button>
</form></body></html>
